name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mock-host test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y liblua5.4-0
      - name: Unit and mock-host tests
        run: python3 -m unittest discover -s tests -v
      - name: Packaging and public metadata
        run: python3 tools/check_release.py
